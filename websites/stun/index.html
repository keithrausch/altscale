
<!-- PAGE GENERATED BY AI -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Server Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #eee;
            margin: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #status {
            margin: 15px 0;
            color: #aaa;
        }

        #status.connected {
            color: #4caf50;
        }

        #status.error {
            color: #ff5252;
        }

        #status.paused {
            color: #ffb74d;
        }

        #status.stale {
            color: #ff9800;
        }

        .controls {
            display: flex;
            align-items: stretch;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            color: #eee;
            background: #383838;
            border: 1px solid #555;
            font-size: 14px;
        }

        button:hover {
            background: #4a4a4a;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .split-button {
            position: relative;
            display: inline-flex;
        }

        .split-button > button {
            margin: 0;
        }

        #togglePolling {
            border-radius: 5px 0 0 5px;
            min-width: 155px;
        }

        #dropdownToggle {
            border-left: none;
            border-radius: 0 5px 5px 0;
            padding-left: 12px;
            padding-right: 12px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            min-width: 150px;
            background: #303030;
            border: 1px solid #555;
            border-radius: 5px;
            z-index: 10;
            box-shadow: 0 4px 10px #0008;
        }

        .dropdown.open {
            display: block;
        }

        .dropdown button {
            width: 100%;
            text-align: left;
            border: none;
            border-radius: 5px;
            background: transparent;
            margin: 0;
        }

        .dropdown button:hover {
            background: #484848;
        }

        #stopButton {
            color: #ff7070;
        }

        #staleBanner {
            display: none;
            background: #4a310f;
            border: 1px solid #b7791f;
            color: #ffcc80;
            padding: 10px 14px;
            border-radius: 5px;
            margin: 15px 0;
        }

        #staleBanner.visible {
            display: block;
        }

        pre {
            background: #292929;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 20px;
            overflow: auto;
            min-height: 150px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .timestamp {
            color: #888;
            font-size: 0.85em;
        }
    </style>
</head>

<body>

    <h1>Server Dashboard</h1>

    <div id="status">Connecting...</div>

    <div class="controls">
        <div class="split-button">
            <button id="togglePolling" onclick="togglePolling()">
                Pause querying
            </button>

            <button id="dropdownToggle"
                    onclick="toggleDropdown()"
                    aria-label="More server actions"
                    aria-expanded="false">
                &#9662;
            </button>

            <div id="dropdown" class="dropdown">
                <button id="stopButton" onclick="stopServer()">
                    Stop server
                </button>
            </div>
        </div>
    </div>

    <div id="staleBanner">
        &#9888; Data may be stale. Automatic server querying is paused.
        Last successful update: <span id="staleTimestamp">Never</span>
    </div>

    <div class="timestamp">
        Last updated: <span id="lastUpdated">Never</span>
    </div>

    <h3>Server Data</h3>

    <pre id="jsonOutput">Waiting for data...</pre>

    <script>

        const API_URL = "/api/query";
        const STOP_URL = "/api/stop";
        const REFRESH_INTERVAL = 5000;

        let pollingEnabled = true;
        let refreshTimer = null;
        let refreshInProgress = false;

        const status = document.getElementById("status");
        const output = document.getElementById("jsonOutput");
        const timestamp = document.getElementById("lastUpdated");
        const staleTimestamp = document.getElementById("staleTimestamp");
        const staleBanner = document.getElementById("staleBanner");

        const toggleButton = document.getElementById("togglePolling");
        const dropdown = document.getElementById("dropdown");
        const dropdownToggle = document.getElementById("dropdownToggle");
        const stopButton = document.getElementById("stopButton");

        async function refreshData() {

            if (!pollingEnabled || refreshInProgress) {
                return;
            }

            refreshInProgress = true;

            try {

                status.textContent = "Updating...";
                status.className = "";

                const response = await fetch(API_URL, {
                    method: "POST",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const data = await response.json();

                // Render formatted JSON
                output.textContent = JSON.stringify(
                    data,
                    null,
                    4
                );

                const now = new Date().toLocaleTimeString();

                timestamp.textContent = now;
                staleTimestamp.textContent = now;

                status.textContent = "Connected";
                status.className = "connected";

            } catch (error) {

                status.textContent = "Connection error";
                status.className = "error";

                output.textContent = error.message;

                console.error("Refresh failed:", error);

            } finally {
                refreshInProgress = false;
            }
        }

        function togglePolling() {

            pollingEnabled = !pollingEnabled;

            if (pollingEnabled) {

                toggleButton.textContent = "Pause querying";

                staleBanner.classList.remove("visible");

                status.textContent = "Resuming queries...";
                status.className = "";

                refreshData();

                refreshTimer = setInterval(
                    refreshData,
                    REFRESH_INTERVAL
                );

            } else {

                clearInterval(refreshTimer);
                refreshTimer = null;

                toggleButton.textContent = "Resume querying";

                staleBanner.classList.add("visible");

                status.textContent = "Paused — data may be stale";
                status.className = "paused";
            }
        }

        function toggleDropdown() {

            const isOpen = dropdown.classList.toggle("open");

            dropdownToggle.setAttribute(
                "aria-expanded",
                String(isOpen)
            );
        }

        async function stopServer() {

            dropdown.classList.remove("open");
            dropdownToggle.setAttribute("aria-expanded", "false");

            stopButton.disabled = true;
            status.textContent = "Stopping server...";
            status.className = "";

            try {

                const response = await fetch(STOP_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: "{}",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                clearInterval(refreshTimer);
                refreshTimer = null;
                pollingEnabled = false;

                toggleButton.textContent = "Resume querying";

                staleBanner.classList.add("visible");

                status.textContent = "Stop request sent";
                status.className = "paused";

            } catch (error) {

                status.textContent = "Stop request failed";
                status.className = "error";

                console.error("Stop failed:", error);

            } finally {
                stopButton.disabled = false;
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener("click", function(event) {

            if (!event.target.closest(".split-button")) {
                dropdown.classList.remove("open");
                dropdownToggle.setAttribute("aria-expanded", "false");
            }
        });

        // Initial query
        refreshData();

        // Periodic refresh
        refreshTimer = setInterval(
            refreshData,
            REFRESH_INTERVAL
        );

    </script>

</body>
</html>
